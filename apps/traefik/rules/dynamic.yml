tls:
  certificates:
    certFile: /certs/local.crt
    keyFile: /certs/local.key

  options:
    default:
      minVersion: VersionTLS12
    mintls13:
      minVersion: VersionTLS13

  stores:
    default:
      defaultCertificate:
        certFile: /certs/local.crt
        keyFile: /certs/local.key

