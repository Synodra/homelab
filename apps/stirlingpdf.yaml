---

services:
  stirlingpdf:
    container_name: stirling-pdf
    image: stirlingtools/stirling-pdf:latest
    profiles: ["utilities", "all"]
    restart: unless-stopped
    hostname: stirling-pdf
    networks:
      traefik:
    # ports:
    #   - '3010:8080'
    environment:
      - DOCKER_ENABLE_SECURITY=false
      - LANGS=en_US
    volumes:
      - ${DOCKER_DIRECTORY}/appdata/stirlingpdf/trainingData:/usr/share/tessdata # Required for extra OCR languages
      - ${DOCKER_DIRECTORY}/appdata/stirlingpdf/extraConfigs:/configs
      - ${DOCKER_DIRECTORY}/appdata/stirlingpdf/customFiles:/customFiles/
      - ${DOCKER_DIRECTORY}/appdata/stirlingpdf/logs:/logs/
      - ${DOCKER_DIRECTORY}/appdata/stirlingpdf/pipeline:/pipeline/
    labels:
      - homepage.group=Applications
      - homepage.name=Stirling PDF
      - homepage.icon=mdi-file-pdf-box
      - homepage.description=Tooling for PDF
      - homepage.container=stirling-pdf
      - homepage.href=https://pdf.${DOMAIN_NAME}/
      - traefik.enable=true
      - traefik.http.routers.stirlingpdf.rule=Host(`pdf.home.lan`)
      - traefik.http.routers.stirlingpdf.entrypoints=web
      # - traefik.http.routers.openspeedtest.tls={}
      - traefik.http.routers.stirlingpdf.service=stirlingpdf-srv
      - traefik.http.services.stirlingpdf-srv.loadbalancer.server.port=8080
